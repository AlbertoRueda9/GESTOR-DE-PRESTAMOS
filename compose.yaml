services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: dwes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Define DB_ADMIN_PASSWORD en .env}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      # Volumen nombrado: los datos sobreviven a "docker compose down".
      # En la imagen 18 se monta en /var/lib/postgresql (no en .../data).
      - datos_pg:/var/lib/postgresql
      # init.sql visible dentro del contenedor (solo lectura) para cargarlo con psql -f
      - ./init.sql:/practica/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dwes"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  datos_pg:
